name: 초과근무 계산기 APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm install

      - name: 웹 파일 복사 (index.html 하나가 원본)
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 앱 아이콘·스플래시 만들기
        run: npx capacitor-assets generate --android

      - name: 웹 파일 동기화
        run: npx cap sync android

      - name: 고정 서명키 적용 (업데이트 설치용)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "고정 서명키를 사용합니다."
          else
            echo "::warning::DEBUG_KEYSTORE_B64 비밀값이 없어 임시 키로 서명합니다. 이 APK는 기존 앱 위에 덮어 설치되지 않습니다."
          fi

      - name: 버전 번호 올리기
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: APK 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: overtime-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
